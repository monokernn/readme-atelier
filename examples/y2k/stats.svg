<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="410" height="230" viewBox="0 0 410 230" fill="none" role="img" aria-label="GitHub stats"><title>GitHub stats</title><style>@font-face{font-family:'RA Unbounded';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'RA Unbounded';font-weight:800;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}text{white-space:pre}@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.ra-l{font-family:'RA Unbounded',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:400;font-style:normal;font-size:10px;fill:#fff;letter-spacing:.28em}
.ra-t{font-family:'RA Unbounded',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:400;font-style:normal;font-size:11px;fill:#fff}
.ra-b{font-family:'RA Unbounded',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:800;font-style:normal;font-size:26px}
.ra-drift{animation:ra-drift 26s ease-in-out infinite alternate}
.ra-drift2{animation:ra-drift 34s ease-in-out infinite alternate-reverse}
@keyframes ra-drift{from{transform:translateX(0)}to{transform:translateX(-46px)}}
.ra-spin{transform-box:fill-box;transform-origin:center;animation:ra-spin 50s linear infinite}
@keyframes ra-spin{to{transform:rotate(360deg)}}
.ra-tw{animation:ra-tw 3.2s ease-in-out infinite}
@keyframes ra-tw{0%,100%{opacity:.15}50%{opacity:1}}
.ra-bub{animation:ra-bub 7s ease-in infinite;opacity:0}
@keyframes ra-bub{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-190px);opacity:0}}
.ra-sh{animation:ra-sh 6s ease-in-out infinite}
@keyframes ra-sh{0%{transform:translateX(-300px)}60%,100%{transform:translateX(1100px)}}
.ra-pulse{animation:ra-pulse 2.4s ease-in-out infinite}
@keyframes ra-pulse{50%{opacity:.55}}
.ra-acc{fill:#ff5fc8}</style><defs><clipPath id="ra-clip"><rect width="410" height="230" rx="18"/></clipPath>
<linearGradient id="ra-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#01063d"/><stop offset=".42" stop-color="#0a26c4"/><stop offset=".78" stop-color="#3a74ff"/><stop offset="1" stop-color="#b3d1ff"/></linearGradient>
<linearGradient id="ra-deep" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#01063d"/><stop offset=".6" stop-color="#0a22b0"/><stop offset="1" stop-color="#2f62f5"/></linearGradient>
<linearGradient id="ra-water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2557e8"/><stop offset=".18" stop-color="#0b2499"/><stop offset="1" stop-color="#010523"/></linearGradient>
<linearGradient id="ra-chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".42" stop-color="#dfe7ff"/><stop offset=".5" stop-color="#6d8cff"/><stop offset=".56" stop-color="#ffffff"/><stop offset="1" stop-color="#c4d2ff"/></linearGradient>
<linearGradient id="ra-refl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5fc8" stop-opacity=".55"/><stop offset="1" stop-color="#ff5fc8" stop-opacity="0"/></linearGradient>
<linearGradient id="ra-glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".45" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity=".03"/></linearGradient>
<linearGradient id="ra-shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="ra-sun"><stop offset="0" stop-color="#fff"/><stop offset=".18" stop-color="#fff" stop-opacity=".95"/><stop offset=".42" stop-color="#cfe2ff" stop-opacity=".45"/><stop offset="1" stop-color="#5b8cff" stop-opacity="0"/></radialGradient>
<radialGradient id="ra-fish" cx=".5" cy=".46" r=".72"><stop offset=".62" stop-color="#000418" stop-opacity="0"/><stop offset="1" stop-color="#000418" stop-opacity=".78"/></radialGradient>
<filter id="ra-soft" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
<filter id="ra-ripple" x="0" y="-10%" width="100%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.004 0.08" numOctaves="2" seed="4"><animate attributeName="baseFrequency" dur="10s" values="0.004 0.08;0.006 0.105;0.004 0.08" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" scale="16" xChannelSelector="R" yChannelSelector="G"/></filter></defs><g clip-path="url(#ra-clip)"><rect width="410" height="230" fill="url(#ra-deep)"/><circle cx="370" cy="26" r="90" fill="url(#ra-sun)" opacity=".55"/><circle class="ra-bub" style="animation-delay:3.31s;animation-duration:9.6s" cx="148.7" cy="236" r="2.0" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".55"/><circle class="ra-bub" style="animation-delay:4.74s;animation-duration:8.4s" cx="355.9" cy="236" r="5.5" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".55"/><circle class="ra-bub" style="animation-delay:5.20s;animation-duration:6.3s" cx="365.4" cy="236" r="3.3" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".55"/><circle class="ra-bub" style="animation-delay:5.05s;animation-duration:9.0s" cx="131.3" cy="236" r="2.3" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".55"/><circle class="ra-bub" style="animation-delay:6.95s;animation-duration:9.0s" cx="149.9" cy="236" r="3.8" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".55"/><circle class="ra-bub" style="animation-delay:6.53s;animation-duration:7.2s" cx="250.1" cy="236" r="2.7" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".55"/><circle class="ra-bub" style="animation-delay:2.34s;animation-duration:6.9s" cx="46.2" cy="236" r="5.0" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".55"/><rect x="12" y="12" width="386" height="206" rx="14" fill="url(#ra-glass)" stroke="#fff" stroke-opacity=".28"/><path d="M28 12.5H382" stroke="#fff" stroke-opacity=".7" stroke-width="1"/><path class="ra-pulse" transform="translate(36 40) scale(0.5)" d="M0-10C1-3 3-1 10 0 3 1 1 3 0 10-1 3-3 1-10 0-3-1-1-3 0-10Z" fill="#ff5fc8"/><text x="48" y="44" class="ra-l" style="font-size:9.5px">STATS · 12 MO</text><text x="32" y="104" class="ra-b" fill="url(#ra-chrome)" style="font-size:27px">2.2k</text><text x="32" y="124" class="ra-l" fill-opacity=".72" style="font-size:7.5px;letter-spacing:.16em">STARS</text><text x="152" y="104" class="ra-b" fill="url(#ra-chrome)" style="font-size:27px">322</text><text x="152" y="124" class="ra-l" fill-opacity=".72" style="font-size:7.5px;letter-spacing:.16em">COMMITS</text><text x="272" y="104" class="ra-b" fill="url(#ra-chrome)" style="font-size:27px">37</text><text x="272" y="124" class="ra-l" fill-opacity=".72" style="font-size:7.5px;letter-spacing:.16em">PULL REQUESTS</text><text x="32" y="178" class="ra-b" fill="url(#ra-chrome)" style="font-size:27px">21</text><text x="32" y="198" class="ra-l" fill-opacity=".72" style="font-size:7.5px;letter-spacing:.16em">ISSUES</text><text x="152" y="178" class="ra-b" fill="url(#ra-chrome)" style="font-size:27px">25</text><text x="152" y="198" class="ra-l" fill-opacity=".72" style="font-size:7.5px;letter-spacing:.16em">REVIEWS</text><text x="272" y="178" class="ra-b" fill="url(#ra-chrome)" style="font-size:27px">32</text><text x="272" y="198" class="ra-l" fill-opacity=".72" style="font-size:7.5px;letter-spacing:.16em">CONTRIBUTED TO</text><rect width="410" height="230" fill="url(#ra-fish)" opacity=".55"/></g></svg>