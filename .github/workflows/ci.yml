name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build
      - name: dist is up to date
        run: git diff --exit-code -- dist
      - name: render every theme
        run: for t in terminal y2k pixel minimal garden minecraft; do node dist/cli.js build --demo --theme $t --out out/$t; done
